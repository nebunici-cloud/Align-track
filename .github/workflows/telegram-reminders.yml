name: Telegram out-time reminders

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping reminder-check endpoint
        run: |
          curl -sf -X POST "https://align-track-rho.vercel.app/api/telegram-reminder-check" \
            -H "x-reminder-secret: ${{ secrets.REMINDER_CHECK_SECRET }}"
